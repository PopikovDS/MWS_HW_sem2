# Dev profile: verbose logging + convenient defaults
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8080

logging:
  level:
    root: INFO
    com.mipt.popikovdmitriy: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: INFO

# Database for development: use local Postgres via docker-compose. Credentials come from env variables.
spring:
  datasource:
    url: ${DEV_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_db}
    username: ${DEV_DATASOURCE_USERNAME:todo}
    password: ${DEV_DATASOURCE_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration